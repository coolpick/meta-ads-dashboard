<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Meta Ads Live Dashboard</title>
<style>
:root{
 color-scheme:light;
 --bg:#ffffff;--canvas:#FBFCFE;--soft:#F3F7FC;--line:#E4EBF3;--line2:#EFF4F9;
 --tx:#12263F;--tx2:#5B6B7E;--tx3:#93A2B4;
 --primary:#17191D;--primary-weak:#F0F1F3;--primary-bd:#D9DCE1;
 --blue:#5B6B7E;--green:#5B6B7E;--yellow:#5B6B7E;--orange:#5B6B7E;--red:#5B6B7E;--purple:#5B6B7E;--cyan:#5B6B7E;
 --gbg:#F1F3F5;--gbd:#DEE2E7;--rbg:#F1F3F5;--rbd:#DEE2E7;--ybg:#F1F3F5;--ybd:#DEE2E7;
 --bbg:#F1F3F5;--bbd:#DEE2E7;--obg:#F1F3F5;--obd:#DEE2E7;--pbg:#F1F3F5;--pbd:#DEE2E7;
 --up:#F0576A;--up-bg:#FFEEF0;--up-bd:#FBD3D9;--down:#4F92E6;--down-bg:#EBF3FE;--down-bd:#CFE4FB;
 --coolli:#06A6FF;--chika:#E8AE33;--chika-bg:#FDF3DC;--coolpick:#2BC48A;--coolpick-bg:#E4F7EF;
 --sh:0 1px 2px rgba(16,42,70,.03),0 1px 2px rgba(16,42,70,.04);
 --sh2:0 4px 14px rgba(16,42,70,.08),0 2px 6px rgba(16,42,70,.05);
 --r:16px;--sp:16px;
 --fz-page:20px;--fz-sec:16px;--fz-card:13.5px;--fz-body:12.5px;--fz-sub:11px;--fz-kpi:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas)}
body{color:var(--tx);font-family:"Inter","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9dce3;border-radius:8px;border:2px solid var(--canvas)}
::-webkit-scrollbar-thumb:hover{background:#c3c8d2}

/* ===== LAYOUT ===== */
.layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--bg);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;z-index:30}
.brandbox{display:flex;align-items:center;gap:11px;padding:6px 10px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#2A2D33,#4A4E56);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(23,25,29,.28);flex:0 0 36px}
.bname{font-size:14.5px;font-weight:700;line-height:1.2;display:flex;flex-direction:column}
.bname span{font-size:11px;color:var(--tx3);font-weight:500;margin-top:1px}
.navlabel{font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px 6px}
#tabs{display:flex;flex-direction:column;gap:3px}
.tab{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:10px;background:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--tx2);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;text-align:left}
.tab:hover{background:var(--soft);color:var(--tx)}
.tab.on{background:var(--primary-weak);color:var(--primary)}
.tab .dt{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.sidefoot{margin-top:auto;font-size:11px;color:var(--tx3);line-height:1.6;padding:12px;background:var(--soft);border-radius:11px;font-weight:500}
.sidefoot b{color:var(--tx2);font-weight:700}

/* ===== MAIN / TOPBAR ===== */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);padding:13px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tbtitle{font-size:19px;font-weight:750;letter-spacing:-.02em;display:flex;flex-direction:column;line-height:1.15}
.tbtitle span{font-size:12px;color:var(--tx3);font-weight:500;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px;color:var(--tx3);font-weight:500;min-width:0;width:152px;transition:border-color .15s,box-shadow .15s}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak);background:#fff}
.searchbox input{border:none;background:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--tx);font-weight:500;width:100%;padding:0}
.searchbox input::placeholder{color:var(--tx3);font-weight:500}
.qn{font-size:11px;font-weight:700;color:var(--primary);white-space:nowrap}
mark.hit{background:#fef08a;color:inherit;border-radius:3px;padding:0 2px;box-shadow:0 0 0 2px #fef08a}
tr.hitrow>td,.bwc.hitrow,.lg-r.hitrow{background:#fffbeb !important}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,0)}30%{box-shadow:0 0 0 3px rgba(79,70,229,.35)}}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--tx2);font-weight:500;white-space:nowrap}
.chip b{color:var(--tx);font-weight:700}
.chip.goal{background:var(--primary-weak);border-color:var(--primary-bd);color:var(--primary)}
.chip.goal b{color:var(--primary)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--tx2);cursor:pointer;transition:.15s}
.iconbtn:hover{background:var(--soft);color:var(--tx);border-color:var(--tx3)}
.profile{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:30px;background:var(--bg)}
.profile .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2A2D33,#4A4E56);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.profile .pn{font-size:12.5px;font-weight:650}

/* ===== CONTENT ===== */
.content{padding:24px 32px 80px;max-width:1560px;width:100%;margin:0 auto}
section{margin-bottom:24px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.snum{width:24px;height:24px;border-radius:7px;background:var(--primary-weak);color:var(--primary);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
h1{font-size:17px;font-weight:700}
h2{font-size:16px;font-weight:700;letter-spacing:-.015em}
.hkr{font-size:12.5px;font-weight:500;color:var(--tx3)}
.note{font-size:11.5px;color:var(--tx3);margin-left:auto;font-weight:500}
.sub{font-size:12px;color:var(--tx3)}

/* CARD BASE */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card,.kpi,.sig,.bwc,.ic,.goal-t{transition:transform .2s ease,box-shadow .2s ease}
.card:hover,.kpi:hover,.sig:hover,.bwc:hover,.ic:hover,.goal-t:hover{transform:translateY(-2px);box-shadow:var(--sh2)}

/* EXEC SUMMARY */
.sumb{display:grid;grid-template-columns:1.12fr 1fr;gap:16px;margin-bottom:16px}
.sb{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.sb-h{font-size:13px;font-weight:700;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--soft)}
.sb-b{padding:6px 18px 14px}
.kv{list-style:none}
.kv li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:14px;font-weight:650}
.kv li:last-child{border-bottom:none}
.kv .ico{width:22px;text-align:center;flex:0 0 22px;font-size:15px}
.kv .sm{font-size:12px;color:var(--tx2);font-weight:500;margin-left:auto;text-align:right}
.ar-u{color:var(--green);font-weight:800}.ar-d{color:var(--red);font-weight:800}
.ab{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;border-left-width:4px}
.ab:last-child{margin-bottom:0}
.ab .abt{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ab .abt .cnt{font-size:10.5px;font-weight:700;color:var(--tx2);background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:3px 9px;margin-left:auto}
.ab .abd{font-size:12.5px;color:var(--tx2);line-height:1.7}
.ab .abd b{color:var(--tx);font-weight:650}
.ab.off{border-left-color:var(--red)}.ab.exp{border-left-color:var(--green)}.ab.imp{border-left-color:var(--yellow)}
.ab.off .abt{color:var(--red)}.ab.exp .abt{color:var(--green)}.ab.imp .abt{color:var(--yellow)}

/* KPI CARDS */
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.kpi .t{font-size:11.5px;color:var(--tx2);font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1}
.kpi .v small{font-size:12px;font-weight:700;color:var(--tx3);margin-left:2px;letter-spacing:0}
.kpi .d{font-size:11.5px;margin-top:9px;font-weight:600}
.kpi .goal{font-size:10.5px;color:var(--tx3);margin-top:11px;border-top:1px solid var(--line2);padding-top:9px;font-weight:500;line-height:1.5}
.st{font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:6px}
.st.g{background:var(--gbg);color:var(--green)}.st.y{background:var(--ybg);color:var(--yellow)}.st.r{background:var(--rbg);color:var(--red)}
.up{color:var(--green)}.down{color:var(--red)}.mut{color:var(--tx3);font-weight:500}

/* SIGNAL CARDS */
.sigs{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.sig{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.sig .top{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.sig .top .bar{width:4px;height:30px;border-radius:3px;background:var(--primary)}
.sig.c1 .top .bar{background:var(--primary)}.sig.c2 .top .bar{background:var(--primary)}.sig.c3 .top .bar{background:var(--primary)}.sig.c4 .top .bar{background:var(--primary)}
.sig .top .nm{font-size:14.5px;font-weight:700;flex:1}
.sig .bd{padding:22px}
.sig .big{display:flex;gap:12px;margin-bottom:18px}
.sig .bigm{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.sig .bigm .l{font-size:10.5px;color:var(--tx3);font-weight:600;display:flex;justify-content:space-between}
.sig .bigm .v{font-size:22px;font-weight:800;letter-spacing:-.035em;margin-top:4px;line-height:1}
.sig .bigm .v small{font-size:11px;font-weight:700;color:var(--tx3)}
.sig .bigm .g{font-size:9.5px;margin-top:5px;font-weight:600;color:var(--tx3);line-height:1.4}
.sig .sub2{font-size:12px;color:var(--tx2);margin-bottom:18px}
.sigchart-h{font-size:10.5px;font-weight:700;color:var(--tx2);margin:4px 0 9px}
.sigchart{position:relative;height:76px;margin-bottom:18px}
.sigchart svg{position:absolute;inset:0;width:100%;height:100%}
.sig .sub2 b{color:var(--tx);font-weight:700}
.sig .vd{font-size:12.5px;line-height:1.65;padding:15px 16px;border-radius:12px}
.sig .vd .ac{display:block;margin-top:6px;font-weight:700}
.sig.win .vd{background:var(--gbg);color:#3A3F47}
.sig.mid .vd{background:var(--bbg);color:#5B6B7E}
.sig.bad .vd{background:var(--rbg);color:#3A3F47}
.sig .vd b{font-weight:700}

/* CAMPAIGN BLOCK */
.cmp{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.cmp-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.cmp-h .bar{width:4px;height:34px;border-radius:3px;flex:0 0 4px}
.cmp-h .ci{flex:1;min-width:200px}
.cmp-h .cname{font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.cmp-h .cmeta{font-size:11.5px;color:var(--tx3);margin-top:3px}
.cmp-b{padding:18px 20px}
.c1 .bar{background:var(--primary)}.c2 .bar{background:var(--primary)}.c3 .bar{background:var(--primary)}.c4 .bar{background:var(--primary)}
.c1 .cname{color:var(--tx)}.c2 .cname{color:var(--tx)}.c3 .cname{color:var(--tx)}.c4 .cname{color:var(--tx)}
.ckpi{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:16px}
.ck{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.ck .l{font-size:10.5px;color:var(--tx3);font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between}
.ck .v{font-size:17px;font-weight:800;letter-spacing:-.03em}
.ck .v small{font-size:10px;color:var(--tx3);font-weight:700}
.ck .c{font-size:10.5px;margin-top:3px;font-weight:600}
.cum{display:flex;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:16px}
.cum-l{font-size:11px;font-weight:700;color:var(--tx2);margin-right:16px;white-space:nowrap}
.cum-i{display:flex;flex-direction:column;padding:0 18px;border-left:1px solid var(--line);flex:1;min-width:108px}
.cum-i span{font-size:10px;color:var(--tx3);font-weight:600}
.cum-i b{font-size:14px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.cum-i .cd{display:block;font-size:9px;font-weight:700;margin-top:3px;font-style:normal;line-height:1.3}
.cd.up{color:var(--tx2)}.cd.down{color:var(--tx2)}.cd.mut{color:var(--tx3)}
.dv.u{color:var(--up);font-weight:700}.dv.d{color:var(--down);font-weight:700}.dv.z{color:var(--tx3)}

/* TABLE */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-size:10.5px;color:var(--tx3);font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
th:first-child,td:first-child{text-align:left}
thead tr:first-child th{background:var(--soft)}
th:first-child{border-top-left-radius:9px;border-bottom-left-radius:0}
tr th:last-child{border-top-right-radius:9px}
td{padding:12px 11px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;color:var(--tx2)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--soft)}
td.nm{font-weight:650;color:var(--tx)}
td.sub{color:var(--tx3);font-size:11px}
tfoot td{font-weight:800;color:var(--tx);border-top:1px solid var(--line);border-bottom:none;background:var(--soft)}
th.grp{text-align:center;font-size:10px;font-weight:800;padding:7px 9px;border-bottom:1px solid var(--line);letter-spacing:.04em}
th.grp.wk{background:var(--bbg);color:var(--blue)}
th.grp.na{background:transparent;border-bottom-color:transparent}
td.wkc,th.wkc{background:#fafbff}
tbody tr:hover td.wkc{background:#f1f5ff}
tr.dim td{background:#fcfcfd;color:var(--tx3)}
tr.dim td.nm{color:var(--tx2)}
th.srt{cursor:pointer;user-select:none;transition:color .12s}
th.srt:hover{color:var(--tx)}
th.srt::after{content:" ⇅";opacity:.35;font-size:9px}
th.srt.asc::after{content:" ↑";opacity:1;color:var(--primary)}
th.srt.desc::after{content:" ↓";opacity:1;color:var(--primary)}
.badge{display:inline-block;padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:700;border:1px solid;white-space:nowrap}
.b-scale{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.b-stable{background:var(--bbg);color:var(--blue);border-color:var(--bbd)}
.b-watch{background:var(--ybg);color:var(--yellow);border-color:var(--ybd)}
.b-opt{background:var(--obg);color:var(--orange);border-color:var(--obd)}
.b-off{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}

/* CONCLUSION */
.cc{margin-top:16px;padding:15px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--tx2);line-height:1.75}
.cc b{color:var(--tx);font-weight:650}
.cc .k{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--tx);color:#fff;margin-right:8px;letter-spacing:.02em;vertical-align:1px}
.cc .k.r{background:var(--red)}.cc .k.g{background:var(--green)}.cc .k.b{background:var(--primary)}
.cc div+div{margin-top:8px}
.est{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:6px;background:var(--pbg);color:var(--purple);border:1px solid var(--pbd);font-weight:700;vertical-align:1px}

/* CHARTS */
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.ctitle{font-size:13.5px;font-weight:700}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--tx2);font-weight:500}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.legend i.dash{width:12px;height:2px;border-radius:0;background:repeating-linear-gradient(90deg,#0576C9 0 4px,transparent 4px 7px)}
svg{display:block;width:100%;height:auto;overflow:visible}
/* TOP CUMULATIVE CARDS */
.topcards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:start}
.tc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.tc:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.tc .tl{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:12px}
.tc .tv{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1}
.tc .tv small{font-size:12px;font-weight:700;color:var(--tx3);margin-left:2px}
.tc .ts{font-size:11px;color:var(--tx2);font-weight:500;margin-top:10px}
.tc .ts.down{color:var(--red);font-weight:600}
.tc .tdelta{font-size:10px;color:var(--tx3);font-weight:600;margin-top:6px}
.tc.hero{background:#fff;color:var(--tx)}
.tc.hero .tl{color:var(--tx3)}
/* WEEKLY SUMMARY cards+graph */
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.mc4{grid-template-columns:repeat(4,1fr)}
.mc{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.mc .ml{font-size:11px;color:var(--tx3);font-weight:600}
.mc .mv{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:5px 0 7px}
.mc .md{display:flex;align-items:center;gap:7px}
.mc .ms{font-size:10.5px;color:var(--tx3)}
.spark{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 13px 4px;margin-bottom:11px}
.spark-h{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:10px}
.ichart{position:relative;height:210px;margin-bottom:22px}
.ic-svg{position:absolute;inset:0;width:100%;height:100%}
.ic-ov{position:absolute;inset:0;cursor:crosshair}
.ic-vline{position:absolute;top:4px;bottom:18px;width:1px;background:rgba(6,166,255,.4);display:none}
.ic-dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--primary);transform:translate(-50%,-50%);display:none;box-shadow:0 2px 7px rgba(23,25,29,.35)}
.ic-tip{position:absolute;display:none;background:#fff;border:1px solid var(--line);box-shadow:var(--sh2);border-radius:10px;padding:8px 11px;font-size:11.5px;white-space:nowrap;pointer-events:none;z-index:5}
.ic-tip b{display:block;color:var(--tx);font-weight:700;margin-bottom:2px}
.ic-tip span{color:var(--tx);font-weight:700}
.ic-xlab{position:absolute;left:0;right:0;bottom:2px;height:14px}
.ic-xlab span{position:absolute;transform:translateX(-50%);font-size:9.5px;color:var(--tx3);font-weight:600}
.chips2{display:flex;gap:8px;flex-wrap:wrap}
.chips2 span{font-size:11px;font-weight:600;color:var(--tx2);background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:6px 11px}
.mini-h{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:9px}
.hbar{position:relative;height:28px;background:var(--soft);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.hbar-f{position:absolute;left:0;top:0;height:100%;border-radius:7px 0 0 7px;opacity:.82}

/* BEST / WORST */
.bwc{border-radius:var(--r);padding:20px;border:1px solid;box-shadow:var(--sh);height:100%}
.bwc.best{background:linear-gradient(160deg,#f0fdf4,#fff 55%);border-color:var(--gbd)}
.bwc.worst{background:linear-gradient(160deg,#fef2f2,#fff 55%);border-color:var(--rbd)}
.bwc.na{background:var(--soft);border-color:var(--line)}
.bwc .tag{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.bwc.best .tag{color:var(--green)}.bwc.worst .tag{color:var(--red)}.bwc.na .tag{color:var(--tx3)}
.bwc .cn{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:3px}
.bwc .cs{font-size:11px;color:var(--tx3);margin-bottom:14px}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.m{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.m .ml{font-size:9px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.m .mv{font-size:13.5px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
.reason{font-size:12.5px;color:var(--tx2);line-height:1.7}
.reason b{color:var(--tx);font-weight:650}
.reason .rl{display:block;font-size:9px;color:var(--tx3);text-transform:uppercase;letter-spacing:.05em;margin:11px 0 3px;font-weight:800}

/* INSIGHT */
.ic{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.ic .ih{font-size:13.5px;font-weight:700;margin-bottom:9px}
.ic p{font-size:12.5px;color:var(--tx2);line-height:1.7}
.ic p b{color:var(--tx);font-weight:650}
.ic .rec{margin-top:12px;padding:10px 12px;background:var(--primary-weak);border:1px solid var(--primary-bd);border-radius:10px;font-size:11.5px;color:var(--primary);font-weight:600;line-height:1.5}

/* ACTION */
.act{display:grid;grid-template-columns:120px 1fr 250px;gap:18px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh);margin-bottom:11px}
.act .lft{display:flex;flex-direction:column;gap:8px}
.pri{font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:7px;width:fit-content;border:1px solid}
.p1{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.p2{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.p3{background:var(--ybg);color:var(--yellow);border-color:var(--ybd)}
.p4{background:var(--pbg);color:var(--purple);border-color:var(--pbd)}
.p5{background:var(--obg);color:var(--orange);border-color:var(--obd)}
.act .ttl{font-size:13px;font-weight:700}
.act .body{font-size:12.5px;color:var(--tx2);line-height:1.75}

.cg{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:6px;margin-right:5px}
.cg1{background:var(--bbg);color:var(--blue);border:1px solid var(--bbd)}
.cg2{background:var(--pbg);color:var(--purple);border:1px solid var(--pbd)}
.cg3{background:var(--rbg);color:var(--red);border:1px solid var(--rbd)}
.act .impact{font-size:11.5px;color:var(--tx2);background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:11px 13px;line-height:1.6}
.act .impact b{color:var(--tx);font-weight:700;display:block;margin-bottom:2px}
.acards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;margin-bottom:16px}
.acard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);border-top:3px solid var(--line);transition:transform .2s ease,box-shadow .2s ease}
.acard:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.acard.p1{border-top-color:var(--red)}.acard.p2{border-top-color:var(--green)}.acard.p3{border-top-color:var(--yellow)}.acard.p4{border-top-color:var(--purple)}.acard.p5{border-top-color:var(--orange)}
.acard .ah{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.acard .acount{font-size:11px;font-weight:800;color:var(--tx2);background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:3px 10px}
.acard .atitle{font-size:12.5px;font-weight:700;margin-bottom:9px}
.acard .afig{font-size:17px;font-weight:800;letter-spacing:-.02em;margin-bottom:9px}
.acard.p1 .afig{color:var(--red)}.acard.p2 .afig{color:var(--green)}
.acard .asub{font-size:11px;color:var(--tx3);line-height:1.5}
.flowbars{display:flex;flex-direction:column;gap:11px}
.flowrow{display:grid;grid-template-columns:110px 1fr 120px;gap:14px;align-items:center;font-size:12.5px}
.flowrow .fn{font-weight:700;color:var(--tx)}
.flowrow .fbar{height:24px;background:var(--soft);border:1px solid var(--line);border-radius:7px;overflow:hidden}
.flowrow .fbar span{display:block;height:100%;border-radius:6px;opacity:.85}
.flowrow .fv{text-align:right;font-weight:800;color:var(--tx)}

/* NEXT WEEK */
.nwc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.nwc h3{font-size:13px;font-weight:700;margin-bottom:11px}
.nwc ol{margin-left:17px;font-size:12.5px;color:var(--tx2);line-height:1.85}
.nwc ol b{color:var(--tx);font-weight:650}
.checklist .ci2{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);font-size:12.5px;color:var(--tx2);line-height:1.6}
.checklist .ci2:last-child{border-bottom:none}
.checklist .ci2 b{color:var(--tx);font-weight:700}
.checklist .cn2{width:22px;height:22px;border-radius:7px;background:var(--soft);border:1px solid var(--line);font-size:10px;font-weight:700;color:var(--tx2);display:flex;align-items:center;justify-content:center;flex:0 0 22px;margin-top:1px}
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.goal-t{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:15px 16px}

.goal-t .gv{font-size:16px;font-weight:800;letter-spacing:-.02em}
.goal-t .gv small{font-size:12px;color:var(--tx3);font-weight:700;margin-left:1px}
.gbar{height:6px;background:var(--soft);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0 9px}
.gbar span{display:block;height:100%;background:var(--primary);border-radius:6px}
.goal-t .gs .gcur{display:block;font-size:11px;color:var(--tx3);font-weight:500}
.goal-t .gs .gact{display:block;font-size:11.5px;color:var(--primary);font-weight:600;margin-top:5px;line-height:1.4}

/* DETAIL TOGGLE */
.dtog{margin:2px 0 16px;display:flex;justify-content:center}
.dtog button{background:var(--bg);border:1px solid var(--line);border-radius:24px;padding:10px 22px;font-size:12.5px;font-weight:650;color:var(--tx2);cursor:pointer;font-family:inherit;box-shadow:var(--sh);transition:.15s}
.dtog button:hover{color:var(--primary);border-color:var(--primary-bd);background:var(--primary-weak)}
.cdtog{display:flex;margin:0 0 10px}
.cdtog button{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 16px;font-size:12px;font-weight:650;color:var(--tx2);cursor:pointer;font-family:inherit;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.cdtog button:hover{color:var(--primary);border-color:var(--primary-bd);background:var(--primary-weak)}
.cdet-n{font-size:10.5px;font-weight:700;color:var(--tx3);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
.cflow{margin-top:14px}
.cf-head{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:16px;padding:4px 4px 9px;font-size:10px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.03em;border-bottom:1px solid var(--line)}
.cf-row{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:16px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line2)}
.cf-row:last-child{border-bottom:none}
.cf-nm{font-size:12px;font-weight:650;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-c{min-width:0}
.cf-hd{font-size:10px;color:var(--tx3);font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between;gap:6px}
.cf-hd b{color:var(--tx2);font-weight:700;white-space:nowrap}
.msvg{width:100%;height:auto;display:block;overflow:visible}
.dlabel{text-align:center;font-size:10.5px;color:var(--tx3);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:26px 0 6px;position:relative}
.dlabel::before,.dlabel::after{content:"";position:absolute;top:50%;width:28%;height:1px;background:var(--line)}
.dlabel::before{left:4%}.dlabel::after{right:4%}

/* DONUT */
.dn-c{position:relative;max-width:180px;margin:0 auto}
.dn-c .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dn-c .ctr .n{font-size:22px;font-weight:800;letter-spacing:-.03em}
.dn-c .ctr .l{font-size:10px;color:var(--tx3);font-weight:600;margin-top:2px}
.lg-h,.lg-r{display:grid;grid-template-columns:1fr 52px 58px 68px;gap:8px;align-items:center}
.lg-h{font-size:9.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;padding:12px 0 8px;border-bottom:1px solid var(--line)}
.lg-h span:not(:first-child){text-align:right}
.lg-r{padding:9px 0;border-bottom:1px solid var(--line2);font-size:12.5px}
.lg-r:last-child{border-bottom:none}
.lg-r .nm2{display:flex;align-items:center;gap:7px;font-weight:650;color:var(--tx);min-width:0}
.lg-r .sw{width:9px;height:9px;border-radius:3px;flex:0 0 9px}
.lg-r .num{text-align:right;color:var(--tx2);font-weight:600}
.lg-r .eff{text-align:right;font-weight:800;font-size:11.5px}
.eff-g{color:var(--green)}.eff-n{color:var(--tx3)}.eff-r{color:var(--red)}

.ctype{font-size:10px;font-weight:700;color:var(--tx2);background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin-left:7px;vertical-align:2px}
.hero{display:flex;align-items:center;gap:13px;background:linear-gradient(90deg,#fffdf4,#fff 70%);border:1px solid #f2e4b8;border-radius:12px;padding:12px 15px;margin-bottom:12px}
.hero-l{font-size:11px;font-weight:800;color:#b7791f;white-space:nowrap;display:flex;align-items:center;gap:5px}
.hero-c{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-c b{font-size:13px;font-weight:800}
.hero-c span{font-size:11.5px;color:var(--tx2);line-height:1.4}
.flow{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 15px;margin-bottom:14px}
.flow-l{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:8px}
.flow-b{display:flex;align-items:center;gap:3px;flex-wrap:wrap;font-size:12px;color:var(--tx2)}
.flow .fl{font-weight:600;white-space:nowrap}
.flow .fl b{color:var(--tx);font-weight:800}
.flow .fl.lo b{color:var(--red)}
.flow .ar{color:var(--tx3);margin:0 3px}
.hide{display:none !important}

/* ===== RESPONSIVE ===== */
@media(max-width:1440px){.kpis{grid-template-columns:repeat(5,1fr)}.ckpi{grid-template-columns:repeat(4,1fr)}}
@media(max-width:1200px){.sumb,.g2{grid-template-columns:1fr}.sigs,.g3{grid-template-columns:1fr}.goals{grid-template-columns:repeat(2,1fr)}.act{grid-template-columns:1fr;gap:12px}.mgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:1024px){
 .layout{grid-template-columns:1fr}

 .brandbox{padding:0;border:none}.navlabel{display:none}.sidefoot{display:none}
 #tabs{flex-direction:row;gap:6px}

}

/* ============================================================
   GLOBAL DESIGN SYSTEM — 프로젝트 공통 규칙 (override)
   spacing 8/12/16/24/32 · radius 16 · border #E8EAF0 · pastel
============================================================ */
/* Layout: 넓힌 콘텐츠 폭 + 좌우 균형 (좌측 치우침 방지) */
.content{max-width:1680px;padding:24px 32px 96px;margin:0 auto}
section{margin-bottom:24px}
.g2,.g3,.kpis,.sigs,.topcards,.goals,.mcards{gap:16px}

/* Card System: 모든 카드 동일 radius / border / shadow / bg */
.card,.kpi,.tc,.ic,.nwc,.bwc,.sig,.cmp,.sb,.mc,.act,.goal-t{
  background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);min-width:0}
.card,.ic,.nwc,.bwc{padding:24px}
.kpi,.tc,.sb-b{padding:20px}
.mc,.goal-t,.ck{padding:16px}
.cum,.spark,.flow,.hero{border-radius:12px}

.kpi .v,.tc .tv,.sig .bigm .v,.mc .mv{white-space:nowrap;letter-spacing:-.03em}
.kpi .v{font-size:clamp(18px,1.5vw,24px)}
.tc .tv{font-size:clamp(18px,1.55vw,25px)}
.ck .v{font-size:clamp(14px,1.1vw,17px)}
.sig .bigm .v{font-size:clamp(17px,1.4vw,22px)}

/* Typography 계층 */
.tbtitle{font-size:var(--fz-page);font-weight:700}
h2{font-size:var(--fz-sec);font-weight:700}
.ctitle,.sb-h,.ih,.cname{font-size:var(--fz-card);font-weight:700}

/* Toolbar System: 높이·radius·padding·아이콘 통일 */
.topbar-right{gap:8px}
.chip,.searchbox,.iconbtn,.profile{height:34px;display:flex;align-items:center}
.chip{border-radius:10px;padding:0 12px;gap:5px}
.searchbox{border-radius:10px;padding:0 12px;width:200px}
.iconbtn{width:34px;border-radius:10px;padding:0}
.topbar-right svg{width:16px;height:16px;stroke-width:2}
.profile{border-radius:20px;padding:0 12px 0 4px}

/* Button System: Primary / Secondary / Outline / Ghost / Danger */
.btn{height:34px;display:inline-flex;align-items:center;gap:6px;padding:0 14px;border-radius:10px;
  font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border:1px solid transparent;
  transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--primary);color:#fff}

.btn-secondary{background:var(--soft);color:var(--tx);border-color:var(--line)}
.btn-outline{background:#fff;color:var(--tx2);border-color:var(--line)}
.btn-ghost{background:none;color:var(--tx2)}
.btn-danger{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.dtog button{height:auto;min-height:34px;border-radius:10px;padding:9px 18px;transition:transform .2s ease,box-shadow .2s ease}

/* Icon System: 16 / 18 / 20 만 사용, stroke 통일 */
.sidebar svg,.tab svg{width:18px;height:18px;stroke-width:2}

/* Color System: 상태색 파스텔 (신호등·판정) */
.sig.win .vd{color:var(--green)}.sig.mid .vd{color:var(--blue)}.sig.bad .vd{color:var(--red)}
.b-stable{background:var(--bbg);color:#5B6B7E;border-color:var(--bbd)}
.badge{border-radius:8px}
.tc.hero{background:var(--primary);border-color:var(--primary);display:block;text-align:left}
.tc.hero .tl{color:rgba(255,255,255,.85);white-space:nowrap}
.tc.hero .tv{color:#fff}
.tc.hero .tv small{color:rgba(255,255,255,.85)}
.tc.hero .ts{color:#fff;margin-top:10px}
.tc.hero .tbadge{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;background:rgba(255,255,255,.20);color:#fff;font-weight:700;font-size:10.5px;padding:3px 9px;border-radius:20px}

/* Hover & Motion: 그림자만 약하게 + translateY(-2px) 0.2s */
.card,.kpi,.tc,.ic,.bwc,.sig,.goal-t,.mc,.act{transition:transform .2s ease,box-shadow .2s ease}
.card:hover,.kpi:hover,.tc:hover,.ic:hover,.bwc:hover,.sig:hover,.goal-t:hover,.mc:hover,.act:hover{
  transform:translateY(-2px);box-shadow:var(--sh2)}
.cmp:hover{box-shadow:var(--sh)}

/* 반응형 그리드 정렬 유지 */
@media(max-width:1440px){.topcards{grid-template-columns:1fr 1fr 1fr}.kpis{grid-template-columns:repeat(4,1fr)}}

/* ===== SECTION NAV ===== */
.secnav{position:sticky;top:52px;z-index:19;display:flex;gap:6px;overflow-x:auto;padding:8px 28px;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.secnav::-webkit-scrollbar{height:0}
.snav{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-family:inherit;font-size:11px;font-weight:600;color:var(--tx2);cursor:pointer;white-space:nowrap;transition:.15s;line-height:1}
.snav:hover{background:var(--soft);color:var(--tx);border-color:var(--tx3)}

.snav.on .snav-n{background:#fff;color:var(--primary)}

const SORT={};
function smoothPath(pts){
  if(pts.length<2)return '';
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6,c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6,c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=' C'+c1x.toFixed(1)+' '+c1y.toFixed(1)+' '+c2x.toFixed(1)+' '+c2y.toFixed(1)+' '+p2[0].toFixed(1)+' '+p2[1].toFixed(1);
  }
  return d;
}
function miniLine(vals,color){
  const W=280,H=48,PL=5,PR=9,PT=9,PB=8,iw=W-PL-PR,ih=H-PT-PB,n=vals.length,goal=261;
  const mx=Math.max(Math.max(...vals),goal)*1.10;
  const X=i=>PL+iw*i/(n-1),Y=v=>PT+ih*(1-v/mx);
  const pts=vals.map((v,i)=>[X(i),Y(v),v]).filter(p=>p[2]>0).map(p=>[p[0],p[1]]);
  const gy=Y(goal).toFixed(1),gid='g'+Math.random().toString(36).slice(2,7);
  let inner=`<line x1="${PL}" x2="${W-PR}" y1="${gy}" y2="${gy}" stroke="#D7DEE7" stroke-width="1" stroke-dasharray="4 4"/>`;
  if(pts.length>=2){
    const d=smoothPath(pts);
    const area=d+` L${pts[pts.length-1][0].toFixed(1)} ${(PT+ih).toFixed(1)} L${pts[0][0].toFixed(1)} ${(PT+ih).toFixed(1)} Z`;
    inner+=`<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity="0.16"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;
    inner+=`<path d="${area}" fill="url(#${gid})"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const L=pts[pts.length-1];
    inner+=`<circle cx="${L[0].toFixed(1)}" cy="${L[1].toFixed(1)}" r="3" fill="#fff" stroke="${color}" stroke-width="1.8"/>`;
  }else if(pts.length===1){inner+=`<circle cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="3" fill="${color}"/>`;}

function brandTrend(b){
  const cs=b.camps.map(id=>CAMPS.find(c=>c.id===id));
  if(cs.length===1)return cs[0].trend;
  const n=cs[0].trend.length,out=[];
  for(let i=0;i<n;i++){let num=0,den=0;cs.forEach(c=>{const v=c.trend[i],w=c.wk.spend||1;if(v!=null){num+=v*w;den+=w;}});out.push(den?num/den:0);}
  return out;
}

function barGroup(node,data){
  const W=640,H=168,PL=36,PR=14,PT=14,PB=26,iw=W-PL-PR,ih=H-PT-PB;
  const max=(Math.max(...data.flatMap(d=>[d[1],d[2]]))||1)*1.25;
  const s=el('svg',{viewBox:`0 0 ${W} ${H}`});
  for(let i=0;i<=4;i++){const y=PT+ih*i/4,v=Math.round(max*(1-i/4));
    s.appendChild(el('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:i===4?'#d5d9e0':'#f0f1f3','stroke-width':1}));
    const t=el('text',{x:PL-8,y:y+3.5,fill:'#9aa1ac','font-size':9.5,'text-anchor':'end'});t.textContent=v;s.appendChild(t);}
  const gw=iw/data.length,bw=Math.min(22,gw*0.28);
  data.forEach((d,i)=>{
    const cx=PL+gw*(i+0.5);
    [[d[1],'#3A3F47',-bw*0.6],[d[2],'#9AA1AC',bw*0.6]].forEach(([v,c,off])=>{
      const h=ih*v/max,x=cx+off-bw/2,y=PT+ih-h;
      s.appendChild(el('rect',{x,y,width:bw,height:Math.max(h,0),rx:3,fill:c}));
      if(v>0){const t=el('text',{x:cx+off,y:y-5,fill:c,'font-size':9,'font-weight':700,'text-anchor':'middle'});t.textContent=v;s.appendChild(t);}
    });
    const lt=el('text',{x:cx,y:H-9,fill:'#5a6474','font-size':10,'font-weight':600,'text-anchor':'middle'});lt.textContent=d[0];s.appendChild(lt);
  });
  node.appendChild(s);
}

  const id='sp'+Math.random().toString(36).slice(2,6);

function roasChart(node,data,goal,color,opts){
  color=color||'#06A6FF';opts=opts||{};
  const showLab=opts.labels!==false,showGrid=opts.grid!==false;
  const n=data.length,VW=1000,VH=300,PT=showLab?22:10,PB=showLab?34:10,PL=6,PR=6,iw=VW-PL-PR,ih=VH-PT-PB;
  const mx=Math.max(...data,goal)*1.06,mn=Math.min(...data)*0.9;
  const X=i=>PL+iw*i/(n-1),Y=v=>PT+ih*(1-(v-mn)/(mx-mn));
  const pts=data.map((v,i)=>[X(i),Y(v)]);
  const svg=el('svg',{viewBox:`0 0 ${VW} ${VH}`,preserveAspectRatio:'none','class':'ic-svg'});
  if(showGrid){for(let g=0;g<=4;g++){const y=PT+ih*g/4;svg.appendChild(el('line',{x1:PL,x2:VW-PR,y1:y,y2:y,stroke:'#EEF1F5','stroke-width':1,'vector-effect':'non-scaling-stroke'}));}}
  if(goal!=null){const gy=Y(goal);svg.appendChild(el('line',{x1:PL,x2:VW-PR,y1:gy,y2:gy,stroke:'#9AA1AC','stroke-width':1.3,'stroke-dasharray':'6 5','vector-effect':'non-scaling-stroke'}));}
  const id='rc'+Math.random().toString(36).slice(2,6),defs=el('defs',{}),lg=el('linearGradient',{id,x1:0,y1:0,x2:0,y2:1});
  lg.appendChild(el('stop',{offset:'0%','stop-color':color,'stop-opacity':.20}));
  lg.appendChild(el('stop',{offset:'100%','stop-color':color,'stop-opacity':0}));
  defs.appendChild(lg);svg.appendChild(defs);
  svg.appendChild(el('path',{d:`M ${pts[0][0]} ${PT+ih} `+pts.map(q=>`L ${q[0]} ${q[1]}`).join(' ')+` L ${pts[n-1][0]} ${PT+ih} Z`,fill:`url(#${id})`}));
  svg.appendChild(el('path',{d:'M '+pts.map(q=>`${q[0]} ${q[1]}`).join(' L '),fill:'none',stroke:color,'stroke-width':2.2,'stroke-linejoin':'round','stroke-linecap':'round','vector-effect':'non-scaling-stroke'}));
  node.appendChild(svg);
  const ov=document.createElement('div');ov.className='ic-ov';
  ov.innerHTML='<div class="ic-vline"></div><div class="ic-dot"></div><div class="ic-tip"></div>';
  node.appendChild(ov);
  const vline=ov.querySelector('.ic-vline'),dot=ov.querySelector('.ic-dot'),tip=ov.querySelector('.ic-tip');
  dot.style.borderColor=color;dot.style.boxShadow='0 2px 7px '+color+'55';vline.style.background=color;vline.style.opacity='.45';
  function show(i){
    const H=node.clientHeight,leftPct=(pts[i][0]/VW)*100,topPx=(pts[i][1]/VH)*H;
    vline.style.left=leftPct+'%';vline.style.display='block';
    dot.style.left=leftPct+'%';dot.style.top=topPx+'px';dot.style.display='block';
    tip.style.left=leftPct+'%';tip.style.top=(topPx-14)+'px';tip.style.display='block';
    tip.innerHTML=`<b>${DAYS[i]}</b><span style="color:${color}">ROAS ${Math.round(data[i])}%</span>`;
    let tx='-50%';if(leftPct<12)tx='-12%';else if(leftPct>88)tx='-88%';
    tip.style.transform=`translate(${tx},-100%)`;
  }
  function hide(){[vline,dot,tip].forEach(e=>e.style.display='none');}
  ov.addEventListener('mousemove',e=>{
    const r=ov.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,plotL=PL/VW,plotR=1-PR/VW;
    let f=(x-plotL)/(plotR-plotL);f=Math.max(0,Math.min(1,f));
    show(Math.round(f*(n-1)));
  });
  ov.addEventListener('mouseleave',hide);
  if(showLab){const lab=document.createElement('div');lab.className='ic-xlab';
    lab.innerHTML=DAYS.map((d,i)=>i%2===0?`<span style="left:${(pts[i][0]/VW)*100}%">${d}</span>`:'').join('');
    node.appendChild(lab);}
}

function wrapDeltas(root){
  root=root||document.getElementById('app'); if(!root)return;
  const REG=/([\u25B2\u25BC])\s?(\d[\d.,]*)\s?(%p|%|건|원|만원|만|p)?/g;
  const walk=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
    if(!n.nodeValue||!/[\u25B2\u25BC]/.test(n.nodeValue))return NodeFilter.FILTER_REJECT;
    const p=n.parentNode; if(!p)return NodeFilter.FILTER_REJECT;
    if(p.classList&&p.classList.contains('dv'))return NodeFilter.FILTER_REJECT;
    if(p.nodeName==='SCRIPT'||p.nodeName==='STYLE')return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  const nodes=[]; let x; while(x=walk.nextNode())nodes.push(x);
  nodes.forEach(n=>{
    const str=n.nodeValue; REG.lastIndex=0;
    if(!REG.test(str))return; REG.lastIndex=0;
    const frag=document.createDocumentFragment(); let last=0,m;
    while(m=REG.exec(str)){
      if(m.index>last)frag.appendChild(document.createTextNode(str.slice(last,m.index)));
      const sp=document.createElement('span'); sp.className='dv '+(m[1]==='\u25B2'?'u':'d'); sp.textContent=m[0];
      frag.appendChild(sp); last=m.index+m[0].length;
    }
    if(last<str.length)frag.appendChild(document.createTextNode(str.slice(last)));
    n.parentNode.replaceChild(frag,n);
  });
}

     <div class="g2" style="margin-top:14px">${bwCard(c.best)}${bwCard(c.worst)}</div>
    </section>`;
  });
  html+=footer();
  app.innerHTML=html;
  camps.forEach(c=>{
    roasChart(document.getElementById('ct_'+c.id),c.trend,c.goalR,c.color);
    donut(document.getElementById('dn_'+c.id),c.donut);
  });
  bindSort();
  bindColl();
  buildSecNav();wrapDeltas();
}

function route(){
  if(VIEW!=='all' && !BRANDS.some(b=>b.id===VIEW))VIEW='all';
  tabs();
  if(VIEW==='all'){applyTheme(null);renderAll();}
  else{const bb=BRANDS.find(b=>b.id===VIEW);applyTheme(bb.color);renderBrand(bb);}
}
try{const v=localStorage.getItem('metaView'); if(v)VIEW=v;
    const s=localStorage.getItem('metaSort'); if(s)Object.assign(SORT,JSON.parse(s));}catch(e){}
document.getElementById('p1').textContent=META.period.slice(5);
document.getElementById('p2').textContent=META.prev.slice(5);
document.getElementById('upd').textContent=META.dataEnd;
route();
document.getElementById('secnav').addEventListener('click',e=>{
  const btn=e.target.closest('.snav'); if(!btn)return;
  const t=document.getElementById(btn.dataset.t); if(!t)return;
  const w=document.getElementById('moreWrap');
  if(w&&w.contains(t)&&w.classList.contains('hide')){const mb=document.getElementById('moreBtn');if(mb)mb.click();}
  const tb=document.querySelector('.topbar'),nv=document.getElementById('secnav');
  const off=(tb?tb.offsetHeight:0)+(nv?nv.offsetHeight:0)+10;
  const y=t.getBoundingClientRect().top+window.pageYOffset-off;
  window.scrollTo({top:y,behavior:'smooth'});
  document.querySelectorAll('.snav.on').forEach(x=>x.classList.remove('on'));btn.classList.add('on');
});
window.addEventListener('resize',setSecNavTop);setSecNavTop();

/* ================= 검색 ================= */
(function(){
  function clearHits(){
    document.querySelectorAll('mark.hit').forEach(m=>{const t=document.createTextNode(m.textContent);m.replaceWith(t);});
    document.querySelectorAll('.hitrow').forEach(e=>e.classList.remove('hitrow'));
  }
  function hi(node,re){
    for(const ch of [...node.childNodes]){
      if(ch.nodeType===3){
        const t=ch.nodeValue; if(!re.test(t))continue;
        const span=document.createElement('span');
        span.innerHTML=t.replace(re,m=>`<mark class="hit">${m}</mark>`);
        ch.replaceWith(...span.childNodes);
      } else if(ch.nodeType===1 && !['MARK','SCRIPT','STYLE','SVG','INPUT'].includes(ch.tagName)){
        hi(ch,re);
      }
    }
  }
  function run(q){
    clearHits();
    const qn=document.getElementById('qn');
    q=(q||'').trim();
    if(q.length<1){qn.textContent='';return;}
    const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp(esc,'gi');
    const scope=document.getElementById('app');
    hi(scope,re);
    const marks=[...scope.querySelectorAll('mark.hit')];
    marks.forEach(m=>{
      const row=m.closest('tr, .bwc, .lg-r, .cmp, .kpi, .sig');
      if(row)row.classList.add('hitrow');
    });
    qn.textContent = marks.length? marks.length+'건' : '결과 없음';
    if(marks.length){
      const first=marks[0].closest('section, .cmp, .card')||marks[0];
      first.scrollIntoView({behavior:'smooth',block:'center'});
      first.classList.add('flash'); setTimeout(()=>first.classList.remove('flash'),1400);
    }
  }
  let t;
  document.addEventListener('input',e=>{
    if(e.target.id!=='q')return;
    clearTimeout(t); const v=e.target.value; t=setTimeout(()=>run(v),250);
  });
  document.addEventListener('keydown',e=>{
    if(e.target.id==='q' && e.key==='Escape'){e.target.value='';clearHits();document.getElementById('qn').textContent='';}
  });
})();

</script>
