<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Meta Ads Live Dashboard</title>
<style>
:root{
 color-scheme:light;
 --bg:#ffffff;--canvas:#FBFCFE;--soft:#F3F7FC;--line:#E4EBF3;--line2:#EFF4F9;
 --tx:#12263F;--tx2:#5B6B7E;--tx3:#93A2B4;
 --primary:#06A6FF;--primary-weak:#E6F6FF;--primary-bd:#BCE6FF;
 --blue:#06A6FF;--green:#0891D6;--yellow:#3E92E0;--orange:#2E7FD6;--red:#0B4C99;--purple:#2F6FE0;--cyan:#06A6FF;
 --gbg:#E6F5FF;--gbd:#BFE4FF;--rbg:#EAF0F8;--rbd:#C6D6EC;--ybg:#EBF4FF;--ybd:#C9E4FF;
 --bbg:#E6F2FF;--bbd:#BFE0FF;--obg:#EBF3FF;--obd:#CCE4FA;--pbg:#EDF1FE;--pbd:#D6E0FB;
 --sh:0 1px 2px rgba(16,42,70,.03),0 1px 2px rgba(16,42,70,.04);
 --sh2:0 4px 14px rgba(16,42,70,.08),0 2px 6px rgba(16,42,70,.05);
 --r:16px;--sp:16px;
 --fz-page:20px;--fz-sec:16px;--fz-card:13.5px;--fz-body:12.5px;--fz-sub:11px;--fz-kpi:24px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--canvas)}
body{color:var(--tx);font-family:"Inter","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.006em}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#d9dce3;border-radius:8px;border:2px solid var(--canvas)}
::-webkit-scrollbar-thumb:hover{background:#c3c8d2}

/* ===== LAYOUT ===== */
.layout{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:var(--bg);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;z-index:30}
.brandbox{display:flex;align-items:center;gap:11px;padding:6px 10px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#06A6FF,#3EC5FF);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 12px rgba(6,166,255,.30);flex:0 0 36px}
.bname{font-size:14.5px;font-weight:700;line-height:1.2;display:flex;flex-direction:column}
.bname span{font-size:11px;color:var(--tx3);font-weight:500;margin-top:1px}
.navlabel{font-size:10.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;padding:8px 12px 6px}
#tabs{display:flex;flex-direction:column;gap:3px}
.tab{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:none;border-radius:10px;background:none;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--tx2);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s;text-align:left}
.tab:hover{background:var(--soft);color:var(--tx)}
.tab.on{background:var(--primary-weak);color:var(--primary)}
.tab .dt{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.sidefoot{margin-top:auto;font-size:11px;color:var(--tx3);line-height:1.6;padding:12px;background:var(--soft);border-radius:11px;font-weight:500}
.sidefoot b{color:var(--tx2);font-weight:700}

/* ===== MAIN / TOPBAR ===== */
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);padding:13px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.tbtitle{font-size:19px;font-weight:750;letter-spacing:-.02em;display:flex;flex-direction:column;line-height:1.15}
.tbtitle span{font-size:12px;color:var(--tx3);font-weight:500;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12.5px;color:var(--tx3);font-weight:500;min-width:0;width:152px;transition:border-color .15s,box-shadow .15s}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-weak);background:#fff}
.searchbox input{border:none;background:none;outline:none;font-family:inherit;font-size:12.5px;color:var(--tx);font-weight:500;width:100%;padding:0}
.searchbox input::placeholder{color:var(--tx3);font-weight:500}
.qn{font-size:11px;font-weight:700;color:var(--primary);white-space:nowrap}
mark.hit{background:#fef08a;color:inherit;border-radius:3px;padding:0 2px;box-shadow:0 0 0 2px #fef08a}
tr.hitrow>td,.bwc.hitrow,.lg-r.hitrow{background:#fffbeb !important}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(79,70,229,0)}30%{box-shadow:0 0 0 3px rgba(79,70,229,.35)}}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:11.5px;color:var(--tx2);font-weight:500;white-space:nowrap}
.chip b{color:var(--tx);font-weight:700}
.chip.goal{background:var(--primary-weak);border-color:var(--primary-bd);color:var(--primary)}
.chip.goal b{color:var(--primary)}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--tx2);cursor:pointer;transition:.15s}
.iconbtn:hover{background:var(--soft);color:var(--tx);border-color:var(--tx3)}
.profile{display:flex;align-items:center;gap:9px;padding:4px 10px 4px 4px;border:1px solid var(--line);border-radius:30px;background:var(--bg)}
.profile .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#06A6FF,#3EC5FF);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.profile .pn{font-size:12.5px;font-weight:650}

/* ===== CONTENT ===== */
.content{padding:24px 32px 80px;max-width:1560px;width:100%;margin:0 auto}
section{margin-bottom:24px}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.snum{width:24px;height:24px;border-radius:7px;background:var(--primary-weak);color:var(--primary);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
h1{font-size:17px;font-weight:700}
h2{font-size:16px;font-weight:700;letter-spacing:-.015em}
.hkr{font-size:12.5px;font-weight:500;color:var(--tx3)}
.note{font-size:11.5px;color:var(--tx3);margin-left:auto;font-weight:500}
.sub{font-size:12px;color:var(--tx3)}

/* CARD BASE */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card,.kpi,.sig,.bwc,.ic,.goal-t{transition:transform .2s ease,box-shadow .2s ease}
.card:hover,.kpi:hover,.sig:hover,.bwc:hover,.ic:hover,.goal-t:hover{transform:translateY(-2px);box-shadow:var(--sh2)}

/* EXEC SUMMARY */
.sumb{display:grid;grid-template-columns:1.12fr 1fr;gap:16px;margin-bottom:16px}
.sb{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.sb-h{font-size:13px;font-weight:700;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--soft)}
.sb-b{padding:6px 18px 14px}
.kv{list-style:none}
.kv li{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2);font-size:14px;font-weight:650}
.kv li:last-child{border-bottom:none}
.kv .ico{width:22px;text-align:center;flex:0 0 22px;font-size:15px}
.kv .sm{font-size:12px;color:var(--tx2);font-weight:500;margin-left:auto;text-align:right}
.ar-u{color:var(--green);font-weight:800}.ar-d{color:var(--red);font-weight:800}
.ab{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;border-left-width:4px}
.ab:last-child{margin-bottom:0}
.ab .abt{font-size:13px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ab .abt .cnt{font-size:10.5px;font-weight:700;color:var(--tx2);background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:3px 9px;margin-left:auto}
.ab .abd{font-size:12.5px;color:var(--tx2);line-height:1.7}
.ab .abd b{color:var(--tx);font-weight:650}
.ab.off{border-left-color:var(--red)}.ab.exp{border-left-color:var(--green)}.ab.imp{border-left-color:var(--yellow)}
.ab.off .abt{color:var(--red)}.ab.exp .abt{color:var(--green)}.ab.imp .abt{color:var(--yellow)}

/* KPI CARDS */
.kpis{display:grid;grid-template-columns:repeat(7,1fr);gap:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.kpi .t{font-size:11.5px;color:var(--tx2);font-weight:600;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.kpi .v{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1}
.kpi .v small{font-size:12px;font-weight:700;color:var(--tx3);margin-left:2px;letter-spacing:0}
.kpi .d{font-size:11.5px;margin-top:9px;font-weight:600}
.kpi .goal{font-size:10.5px;color:var(--tx3);margin-top:11px;border-top:1px solid var(--line2);padding-top:9px;font-weight:500;line-height:1.5}
.st{font-size:9.5px;font-weight:700;padding:3px 7px;border-radius:6px}
.st.g{background:var(--gbg);color:var(--green)}.st.y{background:var(--ybg);color:var(--yellow)}.st.r{background:var(--rbg);color:var(--red)}
.up{color:var(--green)}.down{color:var(--red)}.mut{color:var(--tx3);font-weight:500}

/* SIGNAL CARDS */
.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.sig{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.sig .top{display:flex;align-items:center;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line2)}
.sig .top .bar{width:4px;height:30px;border-radius:3px}
.sig.c1 .top .bar{background:var(--blue)}.sig.c2 .top .bar{background:var(--purple)}.sig.c3 .top .bar{background:var(--red)}
.sig .top .nm{font-size:14.5px;font-weight:700;flex:1}
.sig .bd{padding:22px}
.sig .big{display:flex;gap:12px;margin-bottom:18px}
.sig .bigm{flex:1;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:14px 15px}
.sig .bigm .l{font-size:10.5px;color:var(--tx3);font-weight:600;display:flex;justify-content:space-between}
.sig .bigm .v{font-size:22px;font-weight:800;letter-spacing:-.035em;margin-top:4px;line-height:1}
.sig .bigm .v small{font-size:11px;font-weight:700;color:var(--tx3)}
.sig .bigm .g{font-size:9.5px;margin-top:5px;font-weight:600;color:var(--tx3);line-height:1.4}
.sig .sub2{font-size:12px;color:var(--tx2);margin-bottom:18px}
.sigchart-h{font-size:10.5px;font-weight:700;color:var(--tx2);margin:4px 0 9px}
.sigchart{position:relative;height:76px;margin-bottom:18px}
.sigchart svg{position:absolute;inset:0;width:100%;height:100%}
.sig .sub2 b{color:var(--tx);font-weight:700}
.sig .vd{font-size:12.5px;line-height:1.65;padding:15px 16px;border-radius:12px}
.sig .vd .ac{display:block;margin-top:6px;font-weight:700}
.sig.win .vd{background:var(--gbg);color:#0891D6}
.sig.mid .vd{background:var(--bbg);color:#2F6FE0}
.sig.bad .vd{background:var(--rbg);color:#0B4C99}
.sig .vd b{font-weight:700}

/* CAMPAIGN BLOCK */
.cmp{background:var(--bg);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;margin-bottom:16px}
.cmp-h{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.cmp-h .bar{width:4px;height:34px;border-radius:3px;flex:0 0 4px}
.cmp-h .ci{flex:1;min-width:200px}
.cmp-h .cname{font-size:14.5px;font-weight:700;letter-spacing:-.015em}
.cmp-h .cmeta{font-size:11.5px;color:var(--tx3);margin-top:3px}
.cmp-b{padding:18px 20px}
.c1 .bar{background:var(--blue)}.c2 .bar{background:var(--purple)}.c3 .bar{background:var(--red)}
.c1 .cname{color:var(--blue)}.c2 .cname{color:var(--purple)}.c3 .cname{color:var(--red)}
.ckpi{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-bottom:16px}
.ck{background:var(--soft);border:1px solid var(--line);border-radius:11px;padding:12px 13px}
.ck .l{font-size:10.5px;color:var(--tx3);font-weight:600;margin-bottom:5px;display:flex;justify-content:space-between}
.ck .v{font-size:17px;font-weight:800;letter-spacing:-.03em}
.ck .v small{font-size:10px;color:var(--tx3);font-weight:700}
.ck .c{font-size:10.5px;margin-top:3px;font-weight:600}
.cum{display:flex;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:16px}
.cum-l{font-size:11px;font-weight:700;color:var(--tx2);margin-right:16px;white-space:nowrap}
.cum-i{display:flex;flex-direction:column;padding:0 18px;border-left:1px solid var(--line);flex:1;min-width:108px}
.cum-i span{font-size:10px;color:var(--tx3);font-weight:600}
.cum-i b{font-size:14px;font-weight:800;letter-spacing:-.02em;margin-top:2px}

/* TABLE */
.tw{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:right;font-size:10.5px;color:var(--tx3);font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--soft)}
th:first-child,td:first-child{text-align:left}
thead tr:first-child th{background:var(--soft)}
th:first-child{border-top-left-radius:9px;border-bottom-left-radius:0}
tr th:last-child{border-top-right-radius:9px}
td{padding:12px 11px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap;color:var(--tx2)}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--soft)}
td.nm{font-weight:650;color:var(--tx)}
td.sub{color:var(--tx3);font-size:11px}
tfoot td{font-weight:800;color:var(--tx);border-top:1px solid var(--line);border-bottom:none;background:var(--soft)}
th.grp{text-align:center;font-size:10px;font-weight:800;padding:7px 9px;border-bottom:1px solid var(--line);letter-spacing:.04em}
th.grp.wk{background:var(--bbg);color:var(--blue)}
th.grp.na{background:transparent;border-bottom-color:transparent}
td.wkc,th.wkc{background:#fafbff}
tbody tr:hover td.wkc{background:#f1f5ff}
tr.dim td{background:#fcfcfd;color:var(--tx3)}
tr.dim td.nm{color:var(--tx2)}
th.srt{cursor:pointer;user-select:none;transition:color .12s}
th.srt:hover{color:var(--tx)}
th.srt::after{content:" ⇅";opacity:.35;font-size:9px}
th.srt.asc::after{content:" ↑";opacity:1;color:var(--primary)}
th.srt.desc::after{content:" ↓";opacity:1;color:var(--primary)}
.badge{display:inline-block;padding:3px 9px;border-radius:7px;font-size:10.5px;font-weight:700;border:1px solid;white-space:nowrap}
.b-scale{background:var(--gbg);color:var(--green);border-color:var(--gbd)}
.b-stable{background:var(--bbg);color:var(--blue);border-color:var(--bbd)}
.b-watch{background:var(--ybg);color:var(--yellow);border-color:var(--ybd)}
.b-opt{background:var(--obg);color:var(--orange);border-color:var(--obd)}
.b-off{background:var(--rbg);color:var(--red);border-color:var(--rbd)}
.pos{color:var(--green);font-weight:700}.neg{color:var(--red);font-weight:700}

/* CONCLUSION */
.cc{margin-top:16px;padding:15px 16px;background:var(--soft);border:1px solid var(--line);border-radius:12px;font-size:12.5px;color:var(--tx2);line-height:1.75}
.cc b{color:var(--tx);font-weight:650}
.cc .k{display:inline-block;font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--tx);color:#fff;margin-right:8px;letter-spacing:.02em;vertical-align:1px}
.cc .k.r{background:var(--red)}.cc .k.g{background:var(--green)}.cc .k.b{background:var(--primary)}
.cc div+div{margin-top:8px}
.est{display:inline-block;font-size:9.5px;padding:1px 6px;border-radius:6px;background:var(--pbg);color:var(--purple);border:1px solid var(--pbd);font-weight:700;vertical-align:1px}

/* CHARTS */
.chead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.ctitle{font-size:13.5px;font-weight:700}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--tx2);font-weight:500}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px}
.legend i.dash{width:12px;height:2px;border-radius:0;background:repeating-linear-gradient(90deg,#0576C9 0 4px,transparent 4px 7px)}
svg{display:block;width:100%;height:auto;overflow:visible}
/* TOP CUMULATIVE CARDS */
.topcards{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;align-items:start}
.tc{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.tc:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.tc .tl{font-size:12px;color:var(--tx3);font-weight:600;margin-bottom:12px}
.tc .tv{font-size:25px;font-weight:800;letter-spacing:-.035em;line-height:1}
.tc .tv small{font-size:12px;font-weight:700;color:var(--tx3);margin-left:2px}
.tc .ts{font-size:11px;color:var(--tx2);font-weight:500;margin-top:10px}
.tc .ts.down{color:var(--red);font-weight:600}
.tc.hero{background:#fff;color:var(--tx)}
.tc.hero .tl{color:var(--tx3)}
/* WEEKLY SUMMARY cards+graph */
.mcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.mc4{grid-template-columns:repeat(4,1fr)}
.mc{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:12px 13px}
.mc .ml{font-size:11px;color:var(--tx3);font-weight:600}
.mc .mv{font-size:20px;font-weight:800;letter-spacing:-.03em;margin:5px 0 7px}
.mc .md{display:flex;align-items:center;gap:7px}
.mc .ms{font-size:10.5px;color:var(--tx3)}
.spark{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:11px 13px 4px;margin-bottom:11px}
.spark-h{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:10px}
.ichart{position:relative;height:210px;margin-bottom:22px}
.ic-svg{position:absolute;inset:0;width:100%;height:100%}
.ic-ov{position:absolute;inset:0;cursor:crosshair}
.ic-vline{position:absolute;top:4px;bottom:18px;width:1px;background:rgba(6,166,255,.4);display:none}
.ic-dot{position:absolute;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid #06A6FF;transform:translate(-50%,-50%);display:none;box-shadow:0 2px 7px rgba(6,166,255,.45)}
.ic-tip{position:absolute;display:none;background:#fff;border:1px solid var(--line);box-shadow:var(--sh2);border-radius:10px;padding:8px 11px;font-size:11.5px;white-space:nowrap;pointer-events:none;z-index:5}
.ic-tip b{display:block;color:var(--tx);font-weight:700;margin-bottom:2px}
.ic-tip span{color:#06A6FF;font-weight:700}
.ic-xlab{position:absolute;left:0;right:0;bottom:2px;height:14px}
.ic-xlab span{position:absolute;transform:translateX(-50%);font-size:9.5px;color:var(--tx3);font-weight:600}
.chips2{display:flex;gap:8px;flex-wrap:wrap}
.chips2 span{font-size:11px;font-weight:600;color:var(--tx2);background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:6px 11px}
.mini-h{font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:9px}
.hbar{position:relative;height:28px;background:var(--soft);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:8px}
.hbar-f{position:absolute;left:0;top:0;height:100%;border-radius:7px 0 0 7px;opacity:.82}
.hbar-t{position:absolute;left:11px;top:0;height:100%;display:flex;align-items:center;font-size:11px;font-weight:700;color:var(--tx)}

/* BEST / WORST */

/* SVG line charts */
const W=640,H=210,PL=54,PR=16,PT=14,PB=24,iw=W-PL-PR,ih=H-PT-PB;
const X=i=>PL+iw*i/(DAYS.length-1), Y=(v,mx)=>PT+ih*(1-v/mx);
const fmt=v=>v>=10000?(v/10000).toFixed(0)+'만':v>=1000?(v/1000).toFixed(0)+'k':Math.round(v);
function base(mx,ylab){
  const s=el('svg',{viewBox:`0 0 ${W} ${H}`});
  for(let i=0;i<=4;i++){const y=PT+ih*i/4,v=mx*(1-i/4);
    s.appendChild(el('line',{x1:PL,x2:W-PR,y1:y,y2:y,stroke:i===4?'#d5d9e0':'#f0f1f3','stroke-width':1}));
    const t=el('text',{x:PL-9,y:y+3.5,fill:'#9aa1ac','font-size':9.5,'text-anchor':'end'});t.textContent=ylab(v);s.appendChild(t);}
  DAYS.forEach((d,i)=>{const t=el('text',{x:X(i),y:H-6,fill:'#9aa1ac','font-size':8.5,'text-anchor':'middle'});t.textContent=d;s.appendChild(t);});
  return s;
}
function line(node,data,color,mx,ylab,goal){
  const s=base(mx,ylab);
  if(goal!=null){const gy=Y(goal,mx);s.appendChild(el('line',{x1:PL,x2:W-PR,y1:gy,y2:gy,stroke:'#0576C9','stroke-width':1.3,'stroke-dasharray':'5 4'}));}
  const pts=data.map((v,i)=>[X(i),Y(Math.min(v,mx),mx)]);
  const id='g'+Math.random().toString(36).slice(2,7);
  const defs=el('defs',{}),g=el('linearGradient',{id,x1:0,y1:0,x2:0,y2:1});
  g.appendChild(el('stop',{offset:'0%','stop-color':color,'stop-opacity':.18}));
  g.appendChild(el('stop',{offset:'100%','stop-color':color,'stop-opacity':0}));
  defs.appendChild(g);s.appendChild(defs);
  s.appendChild(el('path',{d:`M ${pts[0][0]} ${PT+ih} `+pts.map(p=>`L ${p[0]} ${p[1]}`).join(' ')+` L ${pts[pts.length-1][0]} ${PT+ih} Z`,fill:`url(#${id})`}));
  s.appendChild(el('path',{d:'M '+pts.map(p=>`${p[0]} ${p[1]}`).join(' L '),fill:'none',stroke:color,'stroke-width':2.2,'stroke-linejoin':'round'}));
  pts.forEach((p,i)=>s.appendChild(el('circle',{cx:p[0],cy:p[1],r:i>=7?3.3:2.5,fill:i>=7?color:'#fff',stroke:color,'stroke-width':1.7})));
  node.appendChild(s);
}
function combo(node){
  const s=base(700000,fmt),bw=iw/DAYS.length*.58;
  TREND.spend.forEach((v,i)=>{const x=X(i)-bw/2,y=Y(v,700000);s.appendChild(el('rect',{x,y,width:bw,height:PT+ih-y,rx:3,fill:i>=7?'#c7d7f0':'#e6eaf0'}));});
  const p=TREND.pur.map((v,i)=>[X(i),Y(v,36)]);
  s.appendChild(el('path',{d:'M '+p.map(q=>`${q[0]} ${q[1]}`).join(' L '),fill:'none',stroke:'#2F6FE0','stroke-width':2.2}));

}
function multi(node,series,mx){

   pts.forEach(p=>s.appendChild(el('circle',{cx:p[0],cy:p[1],r:2.5,fill:'#fff',stroke:c,'stroke-width':1.6})));});

function donut(node,cfg){
  const S=180,R=68,r=45,cx=S/2,cy=S/2;
  const svg=el('svg',{viewBox:`0 0 ${S} ${S}`});
  let a=-Math.PI/2;const arcs=cfg.items.filter(x=>x.p>0);
  if(!arcs.length) svg.appendChild(el('circle',{cx,cy,r:(R+r)/2,fill:'none',stroke:'#e5e7eb','stroke-width':R-r}));
  arcs.forEach(it=>{
    const ang=it.p/cfg.total*Math.PI*2,b=a+ang,big=ang>Math.PI?1:0;
    const x1=cx+R*Math.cos(a),y1=cy+R*Math.sin(a),x2=cx+R*Math.cos(b),y2=cy+R*Math.sin(b);
    const x3=cx+r*Math.cos(b),y3=cy+r*Math.sin(b),x4=cx+r*Math.cos(a),y4=cy+r*Math.sin(a);
    svg.appendChild(el('path',{d:`M ${x1} ${y1} A ${R} ${R} 0 ${big} 1 ${x2} ${y2} L ${x3} ${y3} A ${r} ${r} 0 ${big} 0 ${x4} ${y4} Z`,fill:it.c,stroke:'#fff','stroke-width':2}));
    const pct=it.p/cfg.total*100;
    if(pct>=10){const m=(a+b)/2,lr=(R+r)/2;const t=el('text',{x:cx+lr*Math.cos(m),y:cy+lr*Math.sin(m)+4,fill:'#fff','font-size':11,'font-weight':800,'text-anchor':'middle'});t.textContent=Math.round(pct)+'%';svg.appendChild(t);}
    a=b;});
  const wrap=document.createElement('div');wrap.className='dn-c';
  wrap.appendChild(svg);
  const c=document.createElement('div');c.className='ctr';c.innerHTML=`<div class="n">${cfg.total}</div><div class="l">주간 구매</div>`;
  wrap.appendChild(c);node.appendChild(wrap);
  const lg=document.createElement('div');
  lg.innerHTML=`<div class="lg-h"><span>소재</span><span>구매</span><span>비중</span><span>효율지수</span></div>`+
   cfg.items.map(it=>{const pct=cfg.total?it.p/cfg.total*100:0,eff=it.sp>0?pct/it.sp:0;
    const cls=eff>=1?'eff-g':(eff>=0.7?'eff-n':'eff-r');
    return `<div class="lg-r"><div class="nm2"><span class="sw" style="background:${it.c}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${it.n}</span></div><div class="num">${it.p}건</div><div class="num">${pct.toFixed(1)}%</div><div class="eff ${cls}">${eff.toFixed(2)}${eff>=1?' ▲':(eff<0.7?' ▼':'')}</div></div>`;}).join('');
  node.appendChild(lg);
}
function bwCard(b){

  s.appendChild(el('path',{d:'M '+pts.map(q=>`${q[0]} ${q[1]}`).join(' L '),fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'}));

function roasChart(node,data,goal,color,opts){
  color=color||'#06A6FF';opts=opts||{};
  const showLab=opts.labels!==false,showGrid=opts.grid!==false;
  const n=data.length,VW=1000,VH=300,PT=showLab?22:10,PB=showLab?34:10,PL=6,PR=6,iw=VW-PL-PR,ih=VH-PT-PB;
  const mx=Math.max(...data,goal)*1.06,mn=Math.min(...data)*0.9;
  const X=i=>PL+iw*i/(n-1),Y=v=>PT+ih*(1-(v-mn)/(mx-mn));
  const pts=data.map((v,i)=>[X(i),Y(v)]);
  const svg=el('svg',{viewBox:`0 0 ${VW} ${VH}`,preserveAspectRatio:'none','class':'ic-svg'});
  if(showGrid){for(let g=0;g<=4;g++){const y=PT+ih*g/4;svg.appendChild(el('line',{x1:PL,x2:VW-PR,y1:y,y2:y,stroke:'#EEF1F5','stroke-width':1,'vector-effect':'non-scaling-stroke'}));}}
  if(goal!=null){const gy=Y(goal);svg.appendChild(el('line',{x1:PL,x2:VW-PR,y1:gy,y2:gy,stroke:'#0B62D6','stroke-width':1.3,'stroke-dasharray':'6 5','vector-effect':'non-scaling-stroke'}));}
  const id='rc'+Math.random().toString(36).slice(2,6),defs=el('defs',{}),lg=el('linearGradient',{id,x1:0,y1:0,x2:0,y2:1});
  lg.appendChild(el('stop',{offset:'0%','stop-color':color,'stop-opacity':.20}));
  lg.appendChild(el('stop',{offset:'100%','stop-color':color,'stop-opacity':0}));
  defs.appendChild(lg);svg.appendChild(defs);
  svg.appendChild(el('path',{d:`M ${pts[0][0]} ${PT+ih} `+pts.map(q=>`L ${q[0]} ${q[1]}`).join(' ')+` L ${pts[n-1][0]} ${PT+ih} Z`,fill:`url(#${id})`}));
  svg.appendChild(el('path',{d:'M '+pts.map(q=>`${q[0]} ${q[1]}`).join(' L '),fill:'none',stroke:color,'stroke-width':2.2,'stroke-linejoin':'round','stroke-linecap':'round','vector-effect':'non-scaling-stroke'}));
  node.appendChild(svg);
  const ov=document.createElement('div');ov.className='ic-ov';
  ov.innerHTML='<div class="ic-vline"></div><div class="ic-dot"></div><div class="ic-tip"></div>';
  node.appendChild(ov);
  const vline=ov.querySelector('.ic-vline'),dot=ov.querySelector('.ic-dot'),tip=ov.querySelector('.ic-tip');
  dot.style.borderColor=color;dot.style.boxShadow='0 2px 7px '+color+'55';vline.style.background=color;vline.style.opacity='.45';
  function show(i){
    const H=node.clientHeight,leftPct=(pts[i][0]/VW)*100,topPx=(pts[i][1]/VH)*H;
    vline.style.left=leftPct+'%';vline.style.display='block';
    dot.style.left=leftPct+'%';dot.style.top=topPx+'px';dot.style.display='block';
    tip.style.left=leftPct+'%';tip.style.top=(topPx-14)+'px';tip.style.display='block';
    tip.innerHTML=`<b>${DAYS[i]}</b><span style="color:${color}">ROAS ${Math.round(data[i])}%</span>`;
    let tx='-50%';if(leftPct<12)tx='-12%';else if(leftPct>88)tx='-88%';
    tip.style.transform=`translate(${tx},-100%)`;
  }
  function hide(){[vline,dot,tip].forEach(e=>e.style.display='none');}
  ov.addEventListener('mousemove',e=>{
    const r=ov.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,plotL=PL/VW,plotR=1-PR/VW;
    let f=(x-plotL)/(plotR-plotL);f=Math.max(0,Math.min(1,f));
    show(Math.round(f*(n-1)));
  });
  ov.addEventListener('mouseleave',hide);
  if(showLab){const lab=document.createElement('div');lab.className='ic-xlab';
    lab.innerHTML=DAYS.map((d,i)=>i%2===0?`<span style="left:${(pts[i][0]/VW)*100}%">${d}</span>`:'').join('');
    node.appendChild(lab);}
}

  lg.appendChild(el('stop',{offset:'100%','stop-color':color,'stop-opacity':0}));
  defs.appendChild(lg);s.appendChild(defs);
  s.appendChild(el('path',{d:`M ${pts[0][0]} ${PT+ih} `+pts.map(q=>`L ${q[0]} ${q[1]}`).join(' ')+` L ${pts[pts.length-1][0]} ${PT+ih} Z`,fill:`url(#${id})`}));
  s.appendChild(el('path',{d:'M '+pts.map(q=>`${q[0]} ${q[1]}`).join(' L '),fill:'none',stroke:color,'stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round','vector-effect':'non-scaling-stroke'}));
  node.appendChild(s);
}

function bindSort(){
  document.querySelectorAll('th.srt').forEach(th=>{
    th.onclick=()=>{
      const c=th.dataset.c,i=+th.dataset.i,cur=SORT[c]||{col:2,dir:-1};
      SORT[c]=(cur.col===i)?{col:i,dir:-cur.dir}:{col:i,dir:i===0?1:-1};
      try{localStorage.setItem('metaSort',JSON.stringify(SORT));}catch(e){}
      route();
    };
  });
}

function route(){

/* ================= 검색 ================= */
(function(){
  function clearHits(){
    document.querySelectorAll('mark.hit').forEach(m=>{const t=document.createTextNode(m.textContent);m.replaceWith(t);});
    document.querySelectorAll('.hitrow').forEach(e=>e.classList.remove('hitrow'));
  }
  function hi(node,re){
    for(const ch of [...node.childNodes]){
      if(ch.nodeType===3){
        const t=ch.nodeValue; if(!re.test(t))continue;
        const span=document.createElement('span');
        span.innerHTML=t.replace(re,m=>`<mark class="hit">${m}</mark>`);
        ch.replaceWith(...span.childNodes);
      } else if(ch.nodeType===1 && !['MARK','SCRIPT','STYLE','SVG','INPUT'].includes(ch.tagName)){
        hi(ch,re);
      }
    }
  }
  function run(q){
    clearHits();
    const qn=document.getElementById('qn');
    q=(q||'').trim();
    if(q.length<1){qn.textContent='';return;}
    const esc=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp(esc,'gi');
    const scope=document.getElementById('app');
    hi(scope,re);
    const marks=[...scope.querySelectorAll('mark.hit')];
    marks.forEach(m=>{
      const row=m.closest('tr, .bwc, .lg-r, .cmp, .kpi, .sig');
      if(row)row.classList.add('hitrow');
    });
    qn.textContent = marks.length? marks.length+'건' : '결과 없음';
    if(marks.length){
      const first=marks[0].closest('section, .cmp, .card')||marks[0];
      first.scrollIntoView({behavior:'smooth',block:'center'});
      first.classList.add('flash'); setTimeout(()=>first.classList.remove('flash'),1400);
    }
  }
  let t;
  document.addEventListener('input',e=>{
    if(e.target.id!=='q')return;
    clearTimeout(t); const v=e.target.value; t=setTimeout(()=>run(v),250);
  });
  document.addEventListener('keydown',e=>{
    if(e.target.id==='q' && e.key==='Escape'){e.target.value='';clearHits();document.getElementById('qn').textContent='';}
  });
})();

</script>
